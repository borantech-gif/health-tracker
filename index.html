<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>毎朝の健康記録</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-sub: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="date"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      color: var(--text);
      background-color: #fff;
      outline: none;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    .unit {
      position: absolute;
      right: 14px;
      color: var(--text-sub);
      font-size: 0.9rem;
      pointer-events: none;
    }

    /* 気分ボタン (星1〜5) */
    .mood-container {
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    .mood-btn {
      flex: 1;
      padding: 10px 0;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .mood-btn span {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .mood-btn.active {
      border-color: var(--primary);
      background-color: #eff6ff;
    }

    .mood-btn.active span {
      color: var(--primary);
      font-weight: 700;
    }

    textarea {
      resize: none;
      height: 70px;
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .submit-btn:disabled {
      background-color: var(--text-sub);
      cursor: not-allowed;
    }

    .submit-btn:active:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .notice {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <header>
        <h1>毎朝の健康記録</h1>
        <p class="subtitle">入力内容は自動でスプレッドシートに保存されます</p>
      </header>

      <form id="healthForm">
        <!-- 記録日 -->
        <div class="form-group">
          <label for="recordDate">記録日</label>
          <input type="date" id="recordDate" required>
        </div>

        <!-- 体重 -->
        <div class="form-group">
          <label for="weight">体重</label>
          <div class="input-wrapper">
            <input type="number" id="weight" step="0.1" min="20" max="200" placeholder="65.0" required>
            <span class="unit">kg</span>
          </div>
        </div>

        <!-- 体脂肪率 -->
        <div class="form-group">
          <label for="fat">体脂肪率</label>
          <div class="input-wrapper">
            <input type="number" id="fat" step="0.1" min="1" max="60" placeholder="20.0">
            <span class="unit">%</span>
          </div>
        </div>

        <!-- 睡眠時間 -->
        <div class="form-group">
          <label for="sleep">睡眠時間</label>
          <div class="input-wrapper">
            <input type="number" id="sleep" step="0.5" min="0" max="24" placeholder="7.0" required>
            <span class="unit">時間</span>
          </div>
        </div>

        <!-- 今日の気分 -->
        <div class="form-group">
          <label>気分</label>
          <div class="mood-container">
            <button type="button" class="mood-btn" onclick="setMood(1)">😞<span>1</span></button>
            <button type="button" class="mood-btn" onclick="setMood(2)">🙁<span>2</span></button>
            <button type="button" class="mood-btn active" onclick="setMood(3)">😐<span>3</span></button>
            <button type="button" class="mood-btn" onclick="setMood(4)">🙂<span>4</span></button>
            <button type="button" class="mood-btn" onclick="setMood(5)">😆<span>5</span></button>
          </div>
        </div>

        <!-- メモ -->
        <div class="form-group">
          <label for="memo">メモ</label>
          <textarea id="memo" placeholder="体調の変化、前夜の食事など"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">記録を送信する</button>
        <p class="notice">※送信完了後、PCのスプレッドシートに1行追加されます。</p>
      </form>
    </div>
  </div>

  <script>
    // =========================================================================
    // ★重要★ 下の「ここにURLを貼り付け」の部分に、
    // Google Apps Scriptで発行されたウェブアプリURLを貼り付けてください。
    // 例: const GAS_URL = 'https://script.google.com/macros/s/AKfycby.../exec';
    // =========================================================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzJZF-d1ukeMUGnhA3SuekYpeyAjRhzeYNEGTLViAfRjI47fONkvq6Vo8R3nUc5hJZu/exec';

    let currentMood = 3;

    function setMood(score) {
      currentMood = score;
      const buttons = document.querySelectorAll('.mood-btn');
      buttons.forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === score);
      });
    }

    // 今日の日付をセット
    function resetDateToToday() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('recordDate').value = `${yyyy}-${mm}-${dd}`;
    }

    window.addEventListener('DOMContentLoaded', resetDateToToday);

    // フォーム送信処理
    document.getElementById('healthForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      if (GAS_URL === 'ここにURLを貼り付け' || !GAS_URL.startsWith('https://script.google.com')) {
        alert('Google Apps ScriptのURLが設定されていません。コード内の GAS_URL を確認してください。');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const originalText = submitBtn.innerText;
      submitBtn.disabled = true;
      submitBtn.innerText = '送信中...';

      const payload = {
        date: document.getElementById('recordDate').value,
        weight: document.getElementById('weight').value,
        fat: document.getElementById('fat').value,
        sleep: document.getElementById('sleep').value,
        mood: currentMood,
        memo: document.getElementById('memo').value
      };

      try {
        // Google Apps Scriptへ送信
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'text/plain',
          },
          body: JSON.stringify(payload)
        });

        alert('スプレッドシートへ保存しました！');

        // フォームのリセット
        document.getElementById('healthForm').reset();
        resetDateToToday();
        setMood(3);
      } catch (error) {
        console.error(error);
        alert('送信エラーが発生しました。インターネット接続を確認してください。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = originalText;
      }
    });
  </script>
</body>
</html>
